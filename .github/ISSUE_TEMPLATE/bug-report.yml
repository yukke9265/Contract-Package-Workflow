name: Bug Report
description: Report a bug in the workflow, scripts, templates, prompts, or sample packages.
title: "[Bug] <short-summary>"
labels:
  - bug
body:
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - ContractPackage_Template
        - ContractPackage_BoundedQueue
        - ContractPackage_Utf8LineReader
        - PowerShell scripts
        - CMake flow
        - Custom prompts or agents
        - Documentation
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include exact commands, prompts, or files if possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, shell, compiler, preset, and any relevant VS Code details.
      placeholder: Windows, PowerShell 5.1, x64-debug preset, VS 2022 Community

  - type: textarea
    id: evidence
    attributes:
      label: Logs or evidence
      description: Paste relevant error messages, test failures, or screenshots summary.
